name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # أو master حسب اسم الفرع الرئيسي عندك

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://TharwatSafwat:$HF_TOKEN@huggingface.co/spaces/TharwatSafwat/Options-app mainYOUR_HF_USERNAME/YOUR_SPACE_NAME main
